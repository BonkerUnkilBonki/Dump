# Render Blueprint for the GitHub Releases Dump Bot - WEB SERVICE variant.
# https://render.com/docs/blueprint-spec
#
# You don't have to use this file: you can create the Web Service by hand in
# the dashboard (New + -> Web Service) with the same build/start commands and
# env vars. See README.md.
services:
  - type: web
    name: github-dump-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python dump_bot.py
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: WEB
        value: "true"
      - key: GITHUB_USER
        value: BonkerUnkilBonki
      - key: TELEGRAM_CHANNEL_ID
        value: "@BonkiDump"
      - key: ONCE
        value: "false"
      # Secrets - Render prompts for these on first deploy.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Optional: protects the /sweep endpoint.
      - key: SWEEP_KEY
        sync: false
